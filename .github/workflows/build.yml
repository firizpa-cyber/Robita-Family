name: Build APK + IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure platform folders
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name robita_life --org com.robita.life
          fi
          flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ipa:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure platform folders
        run: |
          if [ ! -d ios ]; then
            flutter create . --project-name robita_life --org com.robita.life
          fi
          flutter pub get

      - name: Build unsigned archive
        # --no-codesign собирает только .xcarchive, экспорт .ipa
        # Xcode без подписи не делает — упакуем вручную шагом ниже.
        run: flutter build ipa --no-codesign

      - name: Pack unsigned IPA
        run: |
          APP_PATH=$(find build/ios/archive -name "Runner.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf payload Runner-unsigned.ipa
          mkdir -p payload/Payload
          cp -R "$APP_PATH" payload/Payload/
          cd payload
          zip -r -y ../Runner-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: Runner-unsigned.ipa
